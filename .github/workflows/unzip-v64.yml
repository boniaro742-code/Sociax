name: Unzip v64
on:
  push:
    branches: [v64]
    paths:
      - 'Sociax_v0_64_0-1.zip'
      - '.github/workflows/unzip-v64.yml'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          set -e
          mkdir /tmp/new
          unzip -q Sociax_v0_64_0-1.zip -d /tmp/new
          rm -rf /tmp/new/Sociax/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name Sociax_v0_64_0-1.zip -exec rm -rf {} +
          cp -a /tmp/new/Sociax/. .
          rm Sociax_v0_64_0-1.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Sociax v0.64.0"
          git push
