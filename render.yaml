# Render "Blueprint": runs the Sociax backend (FastAPI) from the backend/ folder.
# Secret values are NOT written here: Render asks for them (or you type them in the Render dashboard).
services:
  - type: web
    name: sociax-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Firebase service-account file: add it in Render > Environment > Secret Files with exactly this name.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: CLOUDINARY_CLOUD_NAME   # Step 54: no value written here any more (a Blueprint sync used to put the OLD cloud name back); keep the one in the dashboard
        sync: false
      # Step 54 (plan v3.9.2): saved copy of the database on Cloudinary, so accounts survive restarts / deploys (see backend/durable.py)
      - key: SOCIAX_BACKUP
        value: cloudinary
      - key: BACKUP_MIN_INTERVAL
        value: "45"
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: XAI_MODEL
        value: grok-4.6
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Step 65: AI Create (images). Leave GEN_PROVIDER empty = OFF (default, no cost). Set it to "gemini" to turn ON image generation
      # (uses GEMINI_API_KEY above). Videos stay "not available yet" until a video provider is chosen.
      - key: GEN_PROVIDER
        sync: false
      - key: GEN_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: FREE_AI_REQUESTS
        value: "10"
      - key: CHAPA_SECRET_KEY   # TEST key only
        sync: false
      # Step 48 (optional Go ranking engine, see backend-go/README.md). Leave RANK_ENGINE_URL EMPTY and Python ranks by itself (default).
      - key: RANK_ENGINE_URL      # e.g. https://sociax-engine.onrender.com   (no slash at the end)
        sync: false
      - key: RANK_ENGINE_TOKEN    # the SAME secret as ENGINE_TOKEN of the engine service (24+ characters)
        sync: false
      - key: RANK_ENGINE_TIMEOUT_MS
        value: "800"

# Step 50: the Go engine as its own service (ACTIVE). Render asks for ENGINE_TOKEN (a secret of 24+ characters) when it creates it.
# Do NOT fill RANK_ENGINE_URL / RANK_ENGINE_TOKEN of sociax-backend until `python tools/check_engine_deploy.py` says PASS on every line
# (see backend-go/README.md). The free plan sleeps: the first calls after a sleep fall back to Python, the feed never fails.
  - type: web
    name: sociax-engine
    runtime: go
    plan: free
    rootDir: backend-go
    buildCommand: go build -o engine ./cmd/sociax-engine
    startCommand: ./engine
    healthCheckPath: /healthz
    envVars:
      - key: ENGINE_TOKEN       # secret, 24+ characters; the same value goes into RANK_ENGINE_TOKEN of sociax-backend
        sync: false
      - key: LOG_LEVEL
        value: info
